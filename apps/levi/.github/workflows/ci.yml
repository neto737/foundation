name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_WRITE_LOGS: "false"
  WRANGLER_SEND_METRICS: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm test
      - run: npm run build
      - run: npm run worker:build
      # Os harnesses usam somente seus próprios containers PostgreSQL sintéticos.
      # Não recebem URL de banco remoto ou credenciais de migrations.
      - run: npm run test:integration
      - run: npm run test:integration -- --runtime-acls
      # Mesmos cenários workerd com a identidade restrita, sem repetir a suíte.
      - run: npm run test:worker -- --runtime-acls

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # O build curto é local ao job; não transfere artefatos de outro contexto.
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      # Preserva todos os cenários desktop/mobile/proxy com ACLs reais.
      - run: npm run test:e2e -- --runtime-acls

  # Mesmo contrato obrigatório do Foundation: falha/skipped/cancelled não é verde.
  checks:
    if: always()
    needs: [static, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node tools/ci-checks.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

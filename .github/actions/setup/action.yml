name: Setup Foundation
description:
  Install pnpm, Node.js and frozen workspace dependencies after checkout
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7
      with:
        node-version: 22.23.2
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

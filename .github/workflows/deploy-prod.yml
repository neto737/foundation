name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        type: string
      deployment_target:
        description: Deployment target
        required: true
        type: choice
        options:
          - prod
      confirmation:
        description: Type DEPLOY PROD to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require explicit PROD confirmation
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$DEPLOYMENT_TARGET" = "prod"
          test "$CONFIRMATION" = "DEPLOY PROD"

      - name: Check out requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve commit SHA
        id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\` (requested ref: \`$REQUESTED_REF\`)." >> "$GITHUB_STEP_SUMMARY"
        env:
          REQUESTED_REF: ${{ inputs.git_ref }}

  checks:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run:
          pnpm --filter @t00ls-dev/example-basic-d1 exec playwright install
          --with-deps chromium

      - name: Run checks
        run: pnpm check

  deploy:
    needs:
      - resolve
      - checks
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PROD D1 migrations
        working-directory: examples/basic-d1
        run: pnpm db:migrate:prod

      - name: Deploy PROD
        working-directory: examples/basic-d1
        run: pnpm deploy:prod

      - name: Smoke test
        if: env.HEALTH_URL != ''
        run:
          curl --fail --silent --show-error --retry 5 --retry-delay 5
          --retry-all-errors "${HEALTH_URL%/}/ready"

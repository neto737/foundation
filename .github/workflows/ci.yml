name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Unitários
        run:
          pnpm test -- --reporter=default
          --reporter="$GITHUB_WORKSPACE/.github/scripts/vitest-summary.mjs"
        env:
          GITHUB_TEST_SUITE: Unitários
      - name: Integração
        run:
          pnpm test:integration -- --reporter=default
          --reporter="$GITHUB_WORKSPACE/.github/scripts/vitest-summary.mjs"
        env:
          GITHUB_TEST_SUITE: Integração
      - run: pnpm build
      - run: pnpm test:release
      - run: pnpm test:migrations

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run:
          pnpm --filter @t00ls-dev/example-links exec playwright install
          --with-deps chromium

      - run: pnpm test:e2e -- --shard=${{ matrix.shard }}/4

  distribution:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm test:distribution
        env:
          DISTRIBUTION_ATTEMPT: ${{ matrix.attempt }}

  checks:
    if: always()
    needs: [static, tests, e2e, distribution]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node .github/scripts/ci-checks.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

  version:
    if:
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.repository == 't00ls-dev/foundation'
    needs: checks
    runs-on: ubuntu-24.04
    # Shared with manual Release; never interrupt a publication.
    concurrency:
      group: foundation-private-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets may deepen the clone via Git; credentials stay in this job.
          persist-credentials: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the validated SHA to remain master
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run:
          test "$(gh api repos/t00ls-dev/foundation/git/ref/heads/master --jq
          .object.sha)" = "$EXPECTED_SHA"
      - name: Create or update Version Packages and reviewed release record
        uses: changesets/action@v2.1.2
        with:
          version-script: node .github/scripts/release-version.mjs
          create-github-releases: false
          push-git-tags: false
          # Deliberately no publish-script: pushes can never publish packages.

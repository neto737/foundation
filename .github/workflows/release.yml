name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description:
          Audit, approval, publication or isolated credential diagnostic
        type: choice
        options: [audit, approve, publish, resume, diagnose-exchange]
        default: audit
        required: true
      release_pr:
        description: Merged Version Packages PR number
        type: string
        required: true
      release_sha:
        description: Immutable Version Packages merge SHA
        type: string
        required: true
      execution_sha:
        description: Exact master snapshot and executor with approved CI
        type: string
        required: true
      distribution:
        description: Normal npm release or first registration of PR 30 targets
        type: choice
        options: [release, bootstrap]
        default: release
        required: true
      confirmation:
        description:
          Explicit public snapshot approval or publication confirmation
        type: string
        required: false
      plan_digest:
        description:
          Exact audit digest covering destination, snapshot and tarballs
        type: string
        required: false
      changes_digest:
        description:
          Exact digest of reviewed differences from the historical release
        type: string
        required: false
      audit_run:
        description: Successful audit run owning the immutable artifacts
        type: string
        required: false
      approval_run:
        description: Successful owner approval run for these exact artifacts
        type: string
        required: false

permissions: {}

# Retain the shared CI versioning lock; never cancel a publication.
concurrency:
  group: foundation-private-release
  cancel-in-progress: false

env:
  RELEASE_MODE: ${{ inputs.mode }}
  RELEASE_PR: ${{ inputs.release_pr }}
  RELEASE_SHA: ${{ inputs.release_sha }}
  EXECUTION_SHA: ${{ inputs.execution_sha }}
  DISTRIBUTION_MODE: ${{ inputs.distribution }}
  RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
  PLAN_DIGEST: ${{ inputs.plan_digest }}
  CHANGES_DIGEST: ${{ inputs.changes_digest }}
  AUDIT_RUN: ${{ inputs.audit_run }}
  APPROVAL_RUN: ${{ inputs.approval_run }}
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate historical provenance and proposed exact snapshot
        run: node .github/scripts/release.mjs context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the proposed audit artifacts
        run: pnpm --filter './packages/*' -r build
      - name:
          Inspect public registry and prepare exact artifacts and review
          evidence
        id: plan
        run: node .github/scripts/release.mjs prepare "$RUNNER_TEMP/npm-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: foundation-release-${{ steps.plan.outputs.plan_digest }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 30

  approve:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'approve'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify owner identity and current administrator authority by API
        run: node .github/scripts/release.mjs context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: foundation-release-${{ inputs.plan_digest }}
          run-id: ${{ inputs.audit_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/npm-release
      - name:
          Approve reviewed changes, snapshot, destination and exact artifacts
        run: node .github/scripts/release.mjs approve "$RUNNER_TEMP/npm-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: foundation-approval-${{ inputs.plan_digest }}
          path: ${{ runner.temp }}/npm-release/approval.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish' ||
      inputs.mode == 'resume')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require current authorized owner, master snapshot and CI
        run: node .github/scripts/release.mjs context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: foundation-release-${{ inputs.plan_digest }}
          run-id: ${{ inputs.audit_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/npm-release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: foundation-approval-${{ inputs.plan_digest }}
          run-id: ${{ inputs.approval_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/npm-release
      - name: Revalidate approval provenance, bytes and remaining registry plan
        run: node .github/scripts/release.mjs prepare "$RUNNER_TEMP/npm-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-npm-release
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error

  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/master'
          && (inputs.mode == 'publish' || inputs.mode == 'resume')
          && inputs.confirmation == 'PUBLISH_PUBLIC_FOUNDATION_PACKAGES'
          && inputs.execution_sha == github.sha && needs.preflight.result ==
      'success' }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Final gates and authenticated buffer-only consumer, then reconcile
        run: node .github/scripts/release.mjs publish "$RUNNER_TEMP/npm-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_BOOTSTRAP_TOKEN:
            ${{ inputs.distribution == 'bootstrap' &&
            secrets.NPM_BOOTSTRAP_TOKEN || '' }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-release-result
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: warn

  diagnose-exchange:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/master' && inputs.mode == 'diagnose-exchange' &&
      inputs.distribution == 'release' && inputs.execution_sha == github.sha &&
      github.actor == 't00ls-dev' && github.run_attempt == 1 &&
      inputs.confirmation == 'DIAGNOSE_NPM_EXCHANGE_WITHOUT_PUBLICATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: One credential exchange without any package transport
        run: node .github/scripts/release-exchange-diagnostic.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

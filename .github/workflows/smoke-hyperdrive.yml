name: Smoke Hyperdrive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      HYPERDRIVE_SMOKE_URL: ${{ secrets.HYPERDRIVE_SMOKE_URL }}
    steps:
      - name: Require configured endpoint
        run: test -n "$HYPERDRIVE_SMOKE_URL"

      - name: Check remote Hyperdrive adapter
        run:
          curl --fail --silent --show-error --retry 3 --retry-all-errors
          "$HYPERDRIVE_SMOKE_URL"

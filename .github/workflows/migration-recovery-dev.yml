name: Recovery DEV

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description:
          Full current reviewed master SHA with the diagnostic resolution
        type: string
        required: true
      recovery:
        description: Reviewed JSON basename in examples/links/migration-recovery
        type: string
        required: true
      confirmation:
        description: Require RECONCILE_DEV_D1 after human diagnosis
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: foundation-dev-d1
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 't00ls-dev/foundation' && github.ref ==
      'refs/heads/master' && inputs.execution_sha == github.sha &&
      inputs.confirmation == 'RECONCILE_DEV_D1'
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile only the reviewed diagnosis
        run: node .github/scripts/migrations.mjs recover
        env:
          EXPECTED_SHA: ${{ inputs.execution_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name:
            migration-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/migration-recover.json
          if-no-files-found: warn
          retention-days: 30

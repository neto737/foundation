name: Migration DEV

on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
      execution_sha:
        type: string
        required: true
    secrets:
      account_id:
        required: true
      migration_token:
        required: true
      worker_read_token:
        required: false
      health_url:
        required: false

permissions:
  contents: read
  actions: read

# The caller owns foundation-dev-d1 for its entire lifecycle, including deploy.
# A second lock with the same group here would deadlock a reusable workflow.
jobs:
  migration:
    if: >-
      github.repository == 't00ls-dev/foundation' && (github.event_name ==
      'workflow_run' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.execution_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute only the authorized phase
        run: node .github/scripts/migrations.mjs "$MIGRATION_PHASE"
        env:
          MIGRATION_PHASE: ${{ inputs.phase }}
          EXPECTED_SHA: ${{ inputs.execution_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.account_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.migration_token }}
          CLOUDFLARE_WORKER_READ_TOKEN: ${{ secrets.worker_read_token }}
          DEV_HEALTH_URL: ${{ secrets.health_url }}
      - name: Preserve sanitized operation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name:
            migration-${{ inputs.phase }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/migration-${{ inputs.phase }}.json
          if-no-files-found: warn
          retention-days: 30

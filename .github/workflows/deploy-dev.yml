name: Deploy DEV

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description: SHA completo da main com CI de push aprovada para recuperação controlada
        type: string
        required: true
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: levi-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.LEVI_DEV_DEPLOY_ENABLED == 'true' &&
      github.repository == 't00ls-dev/levi' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.execution_sha == github.sha) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 't00ls-dev/levi' &&
      github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validar CI e proteções, publicar e conferir versão e superfície pública
        run: npm run deploy:dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEVI_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.execution_sha }}
          LEVI_MEMBERS_DEV_ORGANIZATIONS: ${{ vars.LEVI_MEMBERS_DEV_ORGANIZATIONS }}
          LEVI_DEV_READY: ${{ vars.LEVI_DEV_READY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          LEVI_HYPERDRIVE_ID: ${{ vars.LEVI_HYPERDRIVE_ID }}
          LEVI_DEV_DATABASE_HOST: ${{ vars.LEVI_DEV_DATABASE_HOST }}
          LEVI_DEV_DATABASE_NAME: ${{ vars.LEVI_DEV_DATABASE_NAME }}
          LEVI_EMAIL_FROM: ${{ vars.LEVI_EMAIL_FROM }}
          LEVI_AUTH_SECRET: ${{ secrets.LEVI_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

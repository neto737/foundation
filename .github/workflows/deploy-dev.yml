name: Deploy DEV

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description:
          Full current master SHA for explicit retry after reconciliation
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: foundation-dev-d1
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 't00ls-dev/foundation' && github.event_name ==
      'workflow_dispatch' && github.ref == 'refs/heads/master' &&
      inputs.execution_sha == github.sha
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: ci
        run: node .github/scripts/ci-evidence.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize validation
        if: always()
        continue-on-error: true
        run: node .github/scripts/deploy-summary.mjs
        env:
          SUMMARY_PHASE: validate
          SUMMARY_STATUS: ${{ job.status }}
          SUMMARY_STEPS: ${{ toJSON(steps) }}

  expand:
    needs: validate
    uses: ./.github/workflows/migrate-dev.yml
    with:
      phase: expand
      execution_sha: ${{ needs.validate.outputs.sha }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_MIGRATION_TOKEN:
        ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}

  deploy:
    needs: [validate, expand]
    if: >-
      needs.expand.result == 'success' && github.repository ==
      't00ls-dev/foundation' && ((github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' && inputs.execution_sha == github.sha)
      || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.repository.full_name == 't00ls-dev/foundation'
      && github.event.workflow_run.head_repository.full_name ==
      't00ls-dev/foundation'))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out trusted workflow validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate CI origin, exact SHA and successful checks job
        id: ci
        run: node .github/scripts/ci-evidence.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the DEV schema before deploy (read-only)
        id: schema
        run: node .github/scripts/migrations.mjs verify
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}

      - name: Deploy DEV
        id: publish
        working-directory: examples/links
        run: pnpm deploy:dev
        env:
          FOUNDATION_DEPLOY_SHA: ${{ needs.validate.outputs.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        id: health
        env:
          HEALTH_URL: ${{ secrets.DEV_HEALTH_URL }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: node .github/scripts/migration-health.mjs

      - name: Summarize deploy and verification
        if: always()
        continue-on-error: true
        run: node .github/scripts/deploy-summary.mjs
        env:
          SUMMARY_PHASE: deploy
          SUMMARY_STATUS: ${{ job.status }}
          SUMMARY_STEPS: ${{ toJSON(steps) }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}

  backfill:
    needs: [validate, deploy]
    uses: ./.github/workflows/migrate-dev.yml
    with:
      phase: backfill
      execution_sha: ${{ needs.validate.outputs.sha }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_MIGRATION_TOKEN:
        ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
      CLOUDFLARE_WORKER_READ_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_READ_TOKEN }}
      DEV_HEALTH_URL: ${{ secrets.DEV_HEALTH_URL }}

  contract:
    needs: [validate, deploy, backfill]
    uses: ./.github/workflows/migrate-dev.yml
    with:
      phase: contract
      execution_sha: ${{ needs.validate.outputs.sha }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_MIGRATION_TOKEN:
        ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
      CLOUDFLARE_WORKER_READ_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_READ_TOKEN }}
      DEV_HEALTH_URL: ${{ secrets.DEV_HEALTH_URL }}

name: Diagnóstico Cloudflare Levi DEV

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description:
          SHA completo da master integrada e autorizada para diagnóstico
        type: string
        required: true
      token_type:
        description: Tipo do token cadastrado, conforme metadados do custodiante
        type: choice
        options: [user, account]
        default: user
        required: true

permissions:
  contents: read

concurrency:
  group: levi-dev-cloudflare-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 't00ls-dev/foundation' && github.event_name ==
      'workflow_dispatch' && github.ref == 'refs/heads/master' &&
      inputs.execution_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: levi-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - name: Consultar somente metadados Cloudflare via GET
        run: node .github/scripts/levi-cloudflare-read.mjs
        env:
          LEVI_DIAGNOSTIC_SHA: ${{ inputs.execution_sha }}
          LEVI_CF_TOKEN_TYPE: ${{ inputs.token_type }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          LEVI_HYPERDRIVE_ID: ${{ vars.LEVI_HYPERDRIVE_ID }}
          LEVI_DEV_DATABASE_HOST: ${{ vars.LEVI_DATABASE_HOST }}
          LEVI_DEV_DATABASE_NAME: ${{ vars.LEVI_DATABASE_NAME }}

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
      time: "03:00"
    open-pull-requests-limit: 30

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
      time: "03:00"
    open-pull-requests-limit: 30
